background_opacity 0.8
background_blur 20

# Hide only the macOS titlebar; the window keeps its rounded corners.
hide_window_decorations titlebar-only

window_padding_width 20

# No confirmation dialog when closing a window with running processes.
confirm_os_window_close 0

# Minimal tab bar: rounded powerline pills. Note: the round caps are opaque
# font glyphs, so they don't pick up background_opacity like the pill bodies.
tab_bar_style powerline
tab_powerline_style round
tab_bar_align center
tab_bar_background none
tab_bar_margin_width 6
tab_bar_margin_height 6 2
# Tabs are labeled with a Serbian Cyrillic capital letter by position, no title.
tab_title_template " {'АБВГДЂЕЖЗИЈКЛЉМНЊОПРСТЋУФХЦЧЏШ'[(index - 1) % 30]} "
active_tab_font_style bold
inactive_tab_font_style normal
active_tab_foreground #ffffff
active_tab_background #45475a
inactive_tab_foreground #9399b2
inactive_tab_background #24252e

# New tabs open in the working directory of the current tab.
map cmd+t new_tab_with_cwd

# Vim-style tab switching. Overrides the macOS default of cmd+h hiding the app.
map cmd+h previous_tab
map cmd+l next_tab
